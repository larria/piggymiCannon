    <section id="opening-loading" aria-label="游戏加载" aria-busy="true">
      <div class="opening-card">
        <p class="opening-brand">咪猪头的疯狂坦克</p>
        <div class="opening-reunion" aria-label="四位炮手集合">
          <div class="opening-orbit" aria-hidden="true"></div><span class="opening-rally" aria-hidden="true">四旗集合</span>
          <button class="opening-seat" disabled aria-label="和咪猪头打个招呼"><img src="/piggymiCannon/portraits/opening-mimi.webp" width="160" height="160" decoding="async" alt="咪猪头"><span class="opening-greeting" role="status"></span></button>
          <button class="opening-seat" disabled aria-label="和大猪头打个招呼"><img src="/piggymiCannon/portraits/opening-dad.webp" width="160" height="160" decoding="async" alt="大猪头"><span class="opening-greeting" role="status"></span></button>
          <button class="opening-seat" disabled aria-label="和阿狸打个招呼"><img src="/piggymiCannon/portraits/opening-fox.webp" width="160" height="160" decoding="async" alt="阿狸"><span class="opening-greeting" role="status"></span></button>
          <button class="opening-seat" disabled aria-label="和小黄鱼打个招呼"><img src="/piggymiCannon/portraits/opening-fish.webp" width="160" height="160" decoding="async" alt="小黄鱼"><span class="opening-greeting" role="status"></span></button>
        </div>
        <h1>这就一起出发</h1><p class="opening-note">炮手正在集合，战场也快准备好了。<small>点一点头像，和大家打个招呼。</small></p>
        <section id="opening-progress" class="material-progress"><div class="material-progress-heading"><span class="material-progress-label">正在准备演习场</span><span class="material-progress-value"></span></div><div class="material-progress-track indeterminate" role="progressbar" aria-label="游戏加载进度" aria-valuemin="0" aria-valuemax="100"><span class="material-progress-fill"></span></div><p class="material-progress-status" role="status"></p></section>
        <div class="opening-actions"><button id="opening-enter" hidden>先进入游戏</button><button id="opening-retry" hidden>重新加载</button></div>
      </div>
    </section>
    <noscript>请开启 JavaScript 后加载游戏。</noscript>
    <div id="app" inert></div>
    <script>window.setTimeout(function(){var el=document.getElementById('opening-retry');if(el&&!window.__openingStarted){el.hidden=false;el.onclick=function(){location.reload()};document.querySelector('#opening-progress .material-progress-status').textContent='加载暂未完成，请联网重试。'}},15000)</script>
